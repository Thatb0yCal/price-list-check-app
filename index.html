<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ushanga Wholesalers Limited</title>
<style>
  :root {
    --brand: #0f8b4c;
    --brand-dark: #0a6b3a;
    --brand-darker: #085530;
    --brand-light: #e5f6ec;
    --accent: #e8a33d;
    --bg: #f4f6f5;
    --surface: #ffffff;
    --text: #16181a;
    --muted: #6b7280;
    --border: #e7eae8;
    --danger: #e0473e;
    --danger-light: #fdecea;
    --shadow-sm: 0 1px 2px rgba(16,24,20,0.04), 0 1px 1px rgba(16,24,20,0.03);
    --shadow-md: 0 10px 30px rgba(12,40,26,0.10);
    --shadow-lg: 0 20px 50px rgba(12,40,26,0.22);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-light); color: var(--brand-darker); }

  header {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: white;
    padding: 22px 18px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow-md);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
  }
  .header-badge {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 14px;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    backdrop-filter: blur(4px);
  }
  .header-titles { flex: 1; min-width: 0; }
  header h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  header p {
    margin: 2px 0 0;
    font-size: 13.5px;
    opacity: 0.88;
  }
  .lock-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.22);
    color: white;
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .lock-btn:active { background: rgba(255,255,255,0.28); }
  .lock-btn.unlocked { background: rgba(255,255,255,0.94); color: var(--brand-darker); }

  .stats-row {
    max-width: 640px;
    margin: 14px auto 0;
    display: flex;
    gap: 10px;
  }
  .stat-pill {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 110px;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .search-wrap svg {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #searchBox {
    width: 100%;
    padding: 14px 16px 14px 46px;
    font-size: 16.5px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #searchBox::placeholder { color: #9aa1a0; }
  #searchBox:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-light);
  }

  .sort-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 2px;
  }
  .result-count {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
  }
  .sort-toggle {
    display: flex;
    background: #e9ece9;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .sort-toggle button {
    border: none;
    background: transparent;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .sort-toggle button.active {
    background: var(--surface);
    color: var(--brand-darker);
    box-shadow: var(--shadow-sm);
  }

  .add-btn {
    position: fixed;
    right: 20px;
    bottom: 22px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 17px 24px 17px 20px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    transition: transform 0.12s ease;
  }
  .add-btn:active { transform: scale(0.95); }

  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 50px;
    line-height: 1.6;
    padding: 0 20px;
  }
  .empty-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--brand-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 16px;
  }
  .empty strong { color: var(--text); display: block; font-size: 16.5px; margin-bottom: 4px; }

  .item-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 15px 16px;
    margin-bottom: 11px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    animation: rise 0.25s ease both;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .item-name-wrap { flex: 1; min-width: 0; }
  .item-name {
    font-weight: 700;
    font-size: 17px;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .item-meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
    overflow-wrap: anywhere;
  }
  .item-prices {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .price-pill {
    font-weight: 800;
    font-size: 15px;
    color: var(--brand-darker);
    background: var(--brand-light);
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .price-pill.buy {
    color: var(--muted);
    background: #eef0ee;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 10px;
  }
  .item-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .item-actions button {
    background: none;
    border: none;
    font-size: 16px;
    padding: 7px 8px;
    cursor: pointer;
    border-radius: 8px;
    line-height: 1;
  }
  .item-actions button:active { background: #eee; }
  .item-actions .del:active { background: var(--danger-light); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,20,15,0.5);
    display: none;
    align-items: flex-end;
    z-index: 30;
    backdrop-filter: blur(2px);
    animation: fadeIn 0.18s ease;
  }
  .overlay.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--surface);
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    padding: 10px 20px 20px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    margin: 8px auto 14px;
  }
  .sheet-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .sheet-title-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--brand-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .sheet h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
  }
  .sheet p.hint {
    margin: 8px 0 0;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  input[type=text], input[type=number], input[type=password], input[type=email] {
    width: 100%;
    padding: 13px 14px;
    font-size: 17px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    font-family: inherit;
    background: #fafbfa;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  input:focus {
    outline: none;
    border-color: var(--brand);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--brand-light);
  }
  .price-input-wrap { position: relative; }
  .price-input-wrap span {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-weight: 700;
    font-size: 15px;
  }
  .price-input-wrap input { padding-left: 52px; }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 15px;
    font-size: 16.5px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; }
  .btn-primary {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: white;
    box-shadow: 0 6px 16px rgba(15,139,76,0.35);
  }
  .btn-secondary { background: #eef0ee; color: var(--text); }

  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #1c1f1d;
    color: white;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.danger { background: var(--danger); }

  .small-sheet .sheet { padding-bottom: 26px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyD4qPnOR_Hct6lf3rp7oBz2wktFbz2REhA",
    authDomain: "price-list-check-app.firebaseapp.com",
    projectId: "price-list-check-app",
    storageBucket: "price-list-check-app.firebasestorage.app",
    messagingSenderId: "987641629071",
    appId: "1:987641629071:web:a5d83d0b25afcdc3c863fa",
    measurementId: "G-8JDXNFPWF6"
  };

  // Must match the Firestore security rule's admin email exactly.
  var ADMIN_EMAIL = "kiragucaleb561@gmail.com";

  var fbApp = initializeApp(firebaseConfig);
  var db = getFirestore(fbApp);
  var auth = getAuth(fbApp);
  var itemsCol = collection(db, "items");

  var SKELETON_HTML = [
    '<header>',
    '  <div class="header-row">',
    '    <div class="header-badge">🏪</div>',
    '    <div class="header-titles">',
    '      <h1>Ushanga Wholesalers</h1>',
    '      <p>Powering Every Shelf</p>',
    '    </div>',
    '    <button class="lock-btn" id="lockBtn">🔒 Admin</button>',
    '  </div>',
    '  <div class="stats-row" id="statsRow"></div>',
    '</header>',
    '<main>',
    '  <div class="search-wrap">',
    '    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>',
    '    <input type="text" id="searchBox" placeholder="Search item name...">',
    '  </div>',
    '  <div class="sort-row" id="sortRow" style="display:none;">',
    '    <div class="result-count" id="resultCount"></div>',
    '    <div class="sort-toggle">',
    '      <button id="sortRecent" class="active">Recent</button>',
    '      <button id="sortAZ">A–Z</button>',
    '    </div>',
    '  </div>',
    '  <div id="list"></div>',
    '</main>',
    '<button class="add-btn" id="openAddBtn" style="display:none;">',
    '  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
    '  Add Item',
    '</button>',
    '<div class="overlay" id="overlay">',
    '  <div class="sheet">',
    '    <div class="sheet-handle"></div>',
    '    <div class="sheet-title-row">',
    '      <div class="sheet-title-icon">🧾</div>',
    '      <h2 id="formTitle">Add an Item</h2>',
    '    </div>',
    '    <label for="f_name">Item name</label>',
    '    <input type="text" id="f_name" placeholder="e.g. Cooking Oil 5L">',
    '    <label for="f_price">Price you paid</label>',
    '    <div class="price-input-wrap"><span>KSh</span>',
    '      <input type="number" id="f_price" placeholder="e.g. 1200" inputmode="decimal">',
    '    </div>',
    '    <label for="f_sell_price">Price to sell (optional)</label>',
    '    <div class="price-input-wrap"><span>KSh</span>',
    '      <input type="number" id="f_sell_price" placeholder="e.g. 1400" inputmode="decimal">',
    '    </div>',
    '    <label for="f_unit">Quantity / Unit (optional)</label>',
    '    <input type="text" id="f_unit" placeholder="e.g. per carton, per kg, 1 bag">',
    '    <label for="f_supplier">Supplier (optional)</label>',
    '    <input type="text" id="f_supplier" placeholder="e.g. Mombasa Traders">',
    '    <label for="f_note">Note (optional)</label>',
    '    <input type="text" id="f_note" placeholder="anything else to remember">',
    '    <div class="sheet-actions">',
    '      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>',
    '      <button class="btn btn-primary" id="saveBtn">Save</button>',
    '    </div>',
    '  </div>',
    '</div>',
    '<div class="overlay small-sheet" id="pinOverlay">',
    '  <div class="sheet">',
    '    <div class="sheet-handle"></div>',
    '    <div class="sheet-title-row">',
    '      <div class="sheet-title-icon">🔒</div>',
    '      <h2>Admin Sign In</h2>',
    '    </div>',
    '    <p class="hint">Sign in with the admin email and password to add, edit, or delete items, and to see buying prices.</p>',
    '    <label for="f_email">Admin email</label>',
    '    <input type="email" id="f_email" placeholder="you@example.com" autocomplete="username">',
    '    <label for="f_password">Password</label>',
    '    <input type="password" id="f_password" placeholder="••••••••" autocomplete="current-password">',
    '    <div class="sheet-actions">',
    '      <button class="btn btn-secondary" id="pinCancelBtn">Cancel</button>',
    '      <button class="btn btn-primary" id="pinSaveBtn">Sign In</button>',
    '    </div>',
    '  </div>',
    '</div>',
    '<div class="toast" id="toast"></div>'
  ].join("\n");

  document.getElementById("app").innerHTML = SKELETON_HTML;

  var listEl = document.getElementById("list");
  var searchBox = document.getElementById("searchBox");
  var overlay = document.getElementById("overlay");
  var openAddBtn = document.getElementById("openAddBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var saveBtn = document.getElementById("saveBtn");
  var formTitle = document.getElementById("formTitle");
  var toast = document.getElementById("toast");
  var statsRow = document.getElementById("statsRow");
  var sortRow = document.getElementById("sortRow");
  var resultCount = document.getElementById("resultCount");
  var sortRecentBtn = document.getElementById("sortRecent");
  var sortAZBtn = document.getElementById("sortAZ");
  var lockBtn = document.getElementById("lockBtn");
  var pinOverlay = document.getElementById("pinOverlay");
  var f_email = document.getElementById("f_email");
  var f_password = document.getElementById("f_password");
  var pinCancelBtn = document.getElementById("pinCancelBtn");
  var pinSaveBtn = document.getElementById("pinSaveBtn");

  var f_name = document.getElementById("f_name");
  var f_price = document.getElementById("f_price");
  var f_sell_price = document.getElementById("f_sell_price");
  var f_unit = document.getElementById("f_unit");
  var f_supplier = document.getElementById("f_supplier");
  var f_note = document.getElementById("f_note");

  var items = [];
  var editingId = null;
  var sortMode = "recent";
  var currentUser = null;
  var initialLoadDone = false;
  var busy = false;

  function isAdmin() {
    return !!(currentUser && currentUser.email === ADMIN_EMAIL);
  }

  function showToast(msg, danger) {
    toast.textContent = msg;
    toast.className = "toast show" + (danger ? " danger" : "");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove("show"); }, 2600);
  }

  function fmtPrice(p) {
    return "KSh " + Number(p).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  function updateLockUI() {
    if (isAdmin()) {
      lockBtn.textContent = "🔓 Admin";
      lockBtn.classList.add("unlocked");
      openAddBtn.style.display = "flex";
    } else {
      lockBtn.textContent = "🔒 Admin";
      lockBtn.classList.remove("unlocked");
      openAddBtn.style.display = "none";
    }
  }

  function sortedItems() {
    var list = items.slice();
    if (sortMode === "az") {
      list.sort(function (a, b) { return a.item_name.localeCompare(b.item_name); });
    }
    return list;
  }

  function renderStats() {
    var total = items.length;
    if (total === 0) { statsRow.innerHTML = ""; return; }
    statsRow.innerHTML = '<div class="stat-pill">📦 ' + total + " item" + (total === 1 ? "" : "s") + "</div>";
  }

  function render() {
    renderStats();
    listEl.innerHTML = "";

    var q = searchBox.value.trim().toLowerCase();
    var admin = isAdmin();
    var visible = sortedItems().filter(function (item) {
      return !q || item.item_name.toLowerCase().indexOf(q) !== -1;
    });

    if (!initialLoadDone) {
      sortRow.style.display = "none";
      listEl.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><strong>Loading price list…</strong></div>';
      return;
    }

    if (items.length === 0) {
      sortRow.style.display = "none";
      listEl.innerHTML =
        '<div class="empty"><div class="empty-icon">🛒</div><strong>No items yet</strong>' +
        (admin ? 'Tap "Add Item" below to add your first price.' : "Ask an admin to add items to the price list.") +
        "</div>";
      return;
    }

    if (visible.length === 0) {
      sortRow.style.display = "none";
      listEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><strong>No matches</strong>Try a different search.</div>';
      return;
    }

    sortRow.style.display = "flex";
    resultCount.textContent = visible.length + " item" + (visible.length === 1 ? "" : "s");

    visible.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "item-card";

      var metaBits = [item.unit, item.supplier, item.note].filter(Boolean);

      var pricesHtml = admin
        ? '<div class="item-prices"><div class="price-pill">' +
          (item.sell_price != null ? fmtPrice(item.sell_price) : fmtPrice(item.buy_price)) +
          '</div><div class="price-pill buy">Bought ' + fmtPrice(item.buy_price) + "</div></div>"
        : '<div class="item-prices"><div class="price-pill">' +
          (item.sell_price != null ? fmtPrice(item.sell_price) : "—") +
          "</div></div>";

      var actionsHtml = admin
        ? '<div class="item-actions"><button class="edit" title="Edit">✏️</button><button class="del" title="Delete">🗑️</button></div>'
        : "";

      card.innerHTML =
        '<div class="item-name-wrap"><div class="item-name">' + escapeHtml(item.item_name) + "</div>" +
        (metaBits.length ? '<div class="item-meta">' + metaBits.map(escapeHtml).join(" · ") + "</div>" : "") +
        "</div>" + pricesHtml + actionsHtml;

      if (admin) {
        card.querySelector(".edit").addEventListener("click", function () { openEdit(item); });
        card.querySelector(".del").addEventListener("click", async function () {
          if (confirm('Delete "' + item.item_name + '" from the price list?')) {
            try {
              await deleteDoc(doc(db, "items", item.id));
              showToast("Deleted");
            } catch (err) {
              handleWriteError(err);
            }
          }
        });
      }

      listEl.appendChild(card);
    });
  }

  function openAdd() {
    if (!isAdmin()) { openSignIn(); return; }
    editingId = null;
    formTitle.textContent = "Add an Item";
    f_name.value = "";
    f_price.value = "";
    f_sell_price.value = "";
    f_unit.value = "";
    f_supplier.value = "";
    f_note.value = "";
    overlay.classList.add("open");
    setTimeout(function () { f_name.focus(); }, 150);
  }

  function openEdit(item) {
    editingId = item.id;
    formTitle.textContent = "Edit Item";
    f_name.value = item.item_name;
    f_price.value = item.buy_price;
    f_sell_price.value = item.sell_price == null ? "" : item.sell_price;
    f_unit.value = item.unit || "";
    f_supplier.value = item.supplier || "";
    f_note.value = item.note || "";
    overlay.classList.add("open");
  }

  function closeForm() { overlay.classList.remove("open"); }

  openAddBtn.addEventListener("click", openAdd);
  cancelBtn.addEventListener("click", closeForm);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeForm(); });

  sortRecentBtn.addEventListener("click", function () {
    sortMode = "recent";
    sortRecentBtn.classList.add("active");
    sortAZBtn.classList.remove("active");
    render();
  });
  sortAZBtn.addEventListener("click", function () {
    sortMode = "az";
    sortAZBtn.classList.add("active");
    sortRecentBtn.classList.remove("active");
    render();
  });

  function setBusy(b) {
    busy = b;
    saveBtn.disabled = b;
    saveBtn.textContent = b ? "Saving…" : "Save";
  }

  function handleWriteError(err) {
    var code = err && err.code;
    if (code === "permission-denied") {
      showToast("You don't have permission to save — please sign in again as admin", true);
      return;
    }
    if (code === "unavailable") {
      showToast("No connection — check your internet and try again", true);
      return;
    }
    showToast("Couldn't save — please try again", true);
  }

  saveBtn.addEventListener("click", async function () {
    if (busy) return;
    if (!isAdmin()) { openSignIn(); return; }
    var name = f_name.value.trim();
    var price = f_price.value.trim();
    if (!name) { showToast("Please enter an item name", true); f_name.focus(); return; }
    if (!price || isNaN(Number(price))) { showToast("Please enter the price you paid", true); f_price.focus(); return; }

    var sellRaw = f_sell_price.value.trim();
    var payload = {
      item_name: name,
      buy_price: Number(price),
      sell_price: sellRaw === "" ? null : Number(sellRaw),
      unit: f_unit.value.trim(),
      supplier: f_supplier.value.trim(),
      note: f_note.value.trim()
    };

    setBusy(true);
    try {
      if (editingId != null) {
        await updateDoc(doc(db, "items", editingId), payload);
        closeForm();
        showToast("Updated ✓");
      } else {
        var existing = items.find(function (i) { return i.item_name.toLowerCase() === name.toLowerCase(); });
        if (existing) {
          await updateDoc(doc(db, "items", existing.id), payload);
        } else {
          await addDoc(itemsCol, payload);
        }
        closeForm();
        showToast("Saved ✓");
      }
    } catch (err) {
      handleWriteError(err);
    } finally {
      setBusy(false);
    }
  });

  function openSignIn() {
    f_email.value = ADMIN_EMAIL;
    f_password.value = "";
    pinOverlay.classList.add("open");
    setTimeout(function () { f_password.focus(); }, 150);
  }
  function closeSignIn() { pinOverlay.classList.remove("open"); }

  lockBtn.addEventListener("click", function () {
    if (isAdmin()) {
      if (confirm("Sign out of admin access on this device?")) {
        signOut(auth).catch(function () {});
      }
    } else {
      openSignIn();
    }
  });
  pinCancelBtn.addEventListener("click", closeSignIn);
  pinOverlay.addEventListener("click", function (e) { if (e.target === pinOverlay) closeSignIn(); });

  function friendlyAuthError(code) {
    if (code === "auth/invalid-email") return "That doesn't look like a valid email";
    if (code === "auth/user-not-found" || code === "auth/invalid-credential" || code === "auth/wrong-password") {
      return "Incorrect email or password";
    }
    if (code === "auth/too-many-requests") return "Too many attempts — please wait a moment and try again";
    if (code === "auth/network-request-failed") return "No connection — check your internet and try again";
    return "Couldn't sign in — please try again";
  }

  var signingIn = false;
  pinSaveBtn.addEventListener("click", async function () {
    if (signingIn) return;
    var email = f_email.value.trim();
    var password = f_password.value;
    if (!email || !password) { showToast("Enter your email and password", true); return; }
    signingIn = true;
    pinSaveBtn.disabled = true;
    pinSaveBtn.textContent = "Signing in…";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      closeSignIn();
      showToast("Admin unlocked ✓");
    } catch (err) {
      showToast(friendlyAuthError(err && err.code), true);
    } finally {
      signingIn = false;
      pinSaveBtn.disabled = false;
      pinSaveBtn.textContent = "Sign In";
    }
  });
  f_password.addEventListener("keydown", function (e) { if (e.key === "Enter") pinSaveBtn.click(); });

  var searchTimer = null;
  searchBox.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 120);
  });

  onAuthStateChanged(auth, function (user) {
    currentUser = user;
    updateLockUI();
    render();
  });

  onSnapshot(itemsCol, function (snapshot) {
    items = snapshot.docs.map(function (d) {
      return Object.assign({ id: d.id }, d.data());
    });
    initialLoadDone = true;
    render();
  }, function (err) {
    initialLoadDone = true;
    showToast("Couldn't load the price list — check your connection", true);
    render();
  });

  updateLockUI();
  render();
})();
</script>
</body>
</html>
